[workspace]
resolver = "2"
members = ["crates/chromaglyph-core", "crates/chromaglyph-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/chromaglyph/chromaglyph"

[workspace.dependencies]
chromaglyph-core = { path = "crates/chromaglyph-core", version = "0.1.0" }
read-fonts = "0.45"
skrifa = "0.48"
write-fonts = "0.54"
rustybuzz = "0.20"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
flate2 = "1"

[profile.release]
lto = "thin"
