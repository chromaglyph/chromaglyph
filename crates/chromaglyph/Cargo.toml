[package]
name = "chromaglyph"
description = "CLI for chromaglyph: build and verify fonts with compiled-in syntax highlighting"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[[bin]]
name = "chromaglyph"
path = "src/main.rs"

[dependencies]
chromaglyph-core.workspace = true
clap.workspace = true
serde_json.workspace = true
chromaglyph-treesitter = { path = "../chromaglyph-treesitter", version = "0.2.2" }
