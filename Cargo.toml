[workspace]
resolver = "2"
members = ["crates/chromaglyph-core", "crates/chromaglyph", "crates/chromaglyph-node", "crates/chromaglyph-treesitter"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/chromaglyph/chromaglyph"

[workspace.dependencies]
chromaglyph-core = { path = "crates/chromaglyph-core", version = "0.2.2" }
read-fonts = "0.45"
skrifa = "0.48"
write-fonts = "0.54"
rustybuzz = "0.20"
# 纯 Rust 路线：fancy-regex 代替 onig（零 C 依赖），自带默认语法集与主题
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
flate2 = "1"

[profile.release]
lto = "thin"
