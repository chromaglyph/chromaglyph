name: cli release binaries

# Prebuilt `chromaglyph` CLI binaries for the full platform matrix,
# attached to a GitHub Release on version tags (v*). On the same tags the
# binaries are also published as the @chromaglyph/cli-* npm platform
# packages plus the `chromaglyph` launcher package (js/cli) — the npm
# side needs the NPM_TOKEN secret. workflow_dispatch builds the same
# matrix and keeps the archives as workflow artifacts — a dry run for
# the pipeline that touches nothing public.

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # arm64 runner
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: macos-latest        # cross to x64
            target: x86_64-apple-darwin
            platform: darwin-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
          - os: ubuntu-latest       # cross via zig (static)
            target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            zig: 'true'
          - os: ubuntu-latest       # cross via zig
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            zig: 'true'
          - os: ubuntu-latest       # cross via zig (static)
            target: aarch64-unknown-linux-musl
            platform: linux-arm64-musl
            zig: 'true'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # same zig + cargo-zigbuild pair the napi workflow verified
      - name: Setup zig (cross targets)
        if: matrix.zig == 'true'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild (cross targets)
        if: matrix.zig == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: cli-${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          # arch-agnostic stripping; musl targets are fully static
          RUSTFLAGS: -C strip=symbols
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }} -p chromaglyph
          else
            cargo build --release --target ${{ matrix.target }} -p chromaglyph
          fi

      - name: Package
        shell: bash
        run: |
          BIN=chromaglyph
          EXE=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then EXE=".exe"; fi
          # Apple Silicon kills unsigned arm64 executables outright;
          # an ad-hoc signature satisfies the requirement
          if [[ "${{ matrix.target }}" == *darwin* ]]; then
            codesign -s - "target/${{ matrix.target }}/release/${BIN}${EXE}"
          fi
          STAGE=stage
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${BIN}${EXE}" "$STAGE/"
          cp LICENSE "$STAGE/"
          if [ -n "$EXE" ]; then
            7z a "chromaglyph-${{ matrix.target }}.zip" "$STAGE"
          else
            tar -czf "chromaglyph-${{ matrix.target }}.tar.gz" -C "$STAGE" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: chromaglyph-${{ matrix.target }}
          path: |
            chromaglyph-${{ matrix.target }}.tar.gz
            chromaglyph-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 14

      # registry-url writes ~/.npmrc wiring NODE_AUTH_TOKEN into npm for
      # the publish step below
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Stage binary into npm platform package
        shell: bash
        run: |
          EXE=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then EXE=".exe"; fi
          PKG="npm/@chromaglyph/cli-${{ matrix.platform }}"
          mkdir -p "$PKG"
          # the same (ad-hoc signed, stripped) binary the release archive
          # carries; the committed template package.json is already at the
          # tag's version
          cp "target/${{ matrix.target }}/release/chromaglyph${EXE}" "$PKG/"

      - name: Publish @chromaglyph/cli platform package (release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG="npm/@chromaglyph/cli-${{ matrix.platform }}"
          NAME="@chromaglyph/cli-${{ matrix.platform }}"
          VERSION=$(node -p "require('./js/cli/package.json').version")
          # idempotent: a platform already published (e.g. a re-pushed
          # tag) skips instead of failing the whole run
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm, skipping"
            exit 0
          fi
          cd "$PKG"
          npm publish --access public --provenance

  # The `chromaglyph` launcher package (js/cli) resolves and spawns the
  # platform binary, so it ships after every @chromaglyph/cli-* of the
  # same version is on npm.
  publish-cli:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish chromaglyph (npm launcher package)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./js/cli/package.json').version")
          if npm view "chromaglyph@$VERSION" version >/dev/null 2>&1; then
            echo "chromaglyph@$VERSION already on npm, skipping"
            exit 0
          fi
          cd js/cli
          npm publish --access public --provenance

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum chromaglyph-* > SHA256SUMS
          ls -l

      - name: Create release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
