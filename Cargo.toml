[workspace]
resolver = "2"
members = ["crates/chromaglyph-core", "crates/chromaglyph", "crates/chromaglyph-node", "crates/chromaglyph-treesitter"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/chromaglyph/chromaglyph"

[workspace.dependencies]
chromaglyph-core = { path = "crates/chromaglyph-core", version = "0.4.0" }
read-fonts = "0.45"
skrifa = "0.48"
write-fonts = "0.54"
rustybuzz = "0.20"
# 纯 Rust 路线：fancy-regex 代替 onig（零 C 依赖），自带默认语法集与主题
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
flate2 = "1"
# WOFF2 输出：纯 Rust 编码器。默认关闭 glyf/loca 表变换（上游已知 Chromium
# 兼容问题，chromaglyph 只用 Brotli 压缩路径）；0.14.1 起接受 OTTO/CFF 输入
ttf2woff2 = { version = "0.14.1", default-features = false }

[profile.release]
lto = "thin"
