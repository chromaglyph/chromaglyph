name: napi build & publish binaries

# Builds @chromaglyph/node platform packages for the full matrix and
# publishes them on release tags (v*). Requires the NPM_TOKEN secret
# (npm granular token with publish rights for the @chromaglyph scope).

permissions:
  contents: write
  id-token: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # arm64 runner
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: macos-latest        # cross to x64
            target: x86_64-apple-darwin
            platform: darwin-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
          - os: ubuntu-latest       # cross via zig
            target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            zig: 'true'
          - os: ubuntu-latest       # cross via zig
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            zig: 'true'
          - os: ubuntu-latest       # cross via zig
            target: aarch64-unknown-linux-musl
            platform: linux-arm64-musl
            zig: 'true'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cargo-zigbuild is auto-installed by `napi build --cross-compile`,
      # but zig itself must be on PATH (matches the locally verified pair)
      - name: Setup zig (cross targets)
        if: matrix.zig == 'true'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.target }}

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ matrix.zig }}" = "true" ]; then EXTRA="--cross-compile"; fi
          pnpm --filter @chromaglyph/node exec napi build --release --platform --target ${{ matrix.target }} $EXTRA

      - name: Stage artifact into platform package
        shell: bash
        run: |
          PKG="npm/@chromaglyph/node-${{ matrix.platform }}"
          mkdir -p "$PKG"
          cp "crates/chromaglyph-node/chromaglyph.${{ matrix.platform }}.node" "$PKG/"

      - name: Publish (release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG="npm/@chromaglyph/node-${{ matrix.platform }}"
          VERSION=$(node -p "require('./crates/chromaglyph-node/package.json').version")
          node -e "
            const fs = require('fs');
            const p = process.argv[1];
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = process.argv[2];
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          " "$PKG/package.json" "$VERSION"
          cd "$PKG"
          npm publish --access public --provenance
